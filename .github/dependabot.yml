version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /runtime
    schedule:
      interval: weekly
    # This suppresses every Ubuntu major-version proposal, including future LTS transitions.
    # Review Ubuntu 26.04 LTS suitability now that it is available; any upgrade needs a
    # separate approved issue and compatibility testing.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
